<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anime.js Demo</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: rgba(17, 24, 39, 0.8);
        --text: #e5eefc;
        --muted: #9fb5d9;
        --accent: #8b5cf6;
        --accent-2: #38bdf8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: radial-gradient(circle at top, rgba(139,92,246,.28), transparent 35%),
                    linear-gradient(135deg, #020817, #0b1020 40%, #111827);
        color: var(--text);
      }
      .shell {
        width: min(980px, calc(100vw - 32px));
        padding: 40px 28px;
        border-radius: 20px;
        background: rgba(15, 23, 42, 0.72);
        border: 1px solid rgba(148, 163, 184, 0.18);
        box-shadow: 0 30px 80px rgba(15, 23, 42, 0.45);
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(2.2rem, 6vw, 4rem);
      }
      p {
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.7;
      }
      .cta {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 18px;
        padding: 14px 24px;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: white;
        text-decoration: none;
        font-weight: 700;
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 26px;
      }
      .badge {
        padding: 8px 12px;
        border: 1px solid rgba(148,163,184,.25);
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.8);
        color: var(--muted);
        font-size: 0.88rem;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <h1>Anime.js</h1>
      <p>
        Demo và examples đang chạy dưới GitHub Pages. Mở bộ demo để xem các ví dụ animation,
        SVG, timeline, draggable, scroll, và nhiều hiệu ứng khác.
      </p>
      <a class="cta" href="./examples/index.html">Mở gallery demo</a>
      <div class="meta">
        <span class="badge">GitHub Pages</span>
        <span class="badge">Static demo</span>
        <span class="badge">Anime.js v4</span>
      </div>
    </main>
  </body>
</html>
